[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-data-insights"
version = "0.1.0"
description = "Automated CSV/Excel insights: missing values, anomalies, statistics, and HTML reports"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
smart-insights = "smart_insights.cli:main"

[tool.setuptools.packages.find]
include = ["smart_insights*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=smart_insights --cov-report=term-missing"